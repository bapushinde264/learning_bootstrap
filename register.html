<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  
    <div class="col-md-4 bg-primary text-center">
                 <i class="bi bi-telephone-fill fs-1"></i>
                 <h3>8767020988</h3>
            </div>
  <div class="container my-5 mt-0">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4 bg-success">
                <h2 class="text-center mb-4">Register</h2>

                <form>

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your name" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email" required>
                    </div>

                    <!-- Contact Number -->
                    <div class="mb-3">
                        <label class="form-label">Contact Number</label>
                        <input type="tel" class="form-control"
                               placeholder="Enter contact number"
                               pattern="[0-9]{10}" required>
                    </div>

                    <!-- Rent / Buy -->
                    <div class="mb-3">
                        <label class="form-label">Requirement</label>
                        <select class="form-select" id="requirement" required>
                            <option value="">Select Requirement</option>
                            <option value="buy">Buy</option>
                            <option value="rent">Rent</option>
                        </select>
                    </div>

                    <!-- Location -->
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <select class="form-select" id="location" required>
                            <option value="">Select Location</option>
                        </select>
                    </div>

                    <!-- Message
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4"
                                  placeholder="Enter your message"></textarea>
                    </div> -->

                    <!-- Submit -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-5">
                            Submit
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>


<script>
    document.getElementById("requirement").addEventListener("change", function () {

        let location = document.getElementById("location");

        location.innerHTML = '<option value="">Select Location</option>';

        if (this.value === "buy") {
            location.innerHTML += `
                <option value="Moshi">Moshi</option>
                <option value="Chikhali">Chikhali</option>
            `;
        }

        if (this.value === "rent") {
            location.innerHTML += `
                <option value="Akurdi">Akurdi</option>
                <option value="Ravet">Ravet</option>
            `;
        }
    });
</script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
