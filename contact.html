
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Estate Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        /* Form width */
        .register-form {
            max-width: 900px;
            margin: auto;
        }

        /* Input size */
        .register-form .form-control,
        .register-form .form-select {
            height: 42px;
        }

    </style>
</head>

<body style="background-color:rgb(166, 159, 159)">

    <!-- Header -->
    <div class="container-fluid m-0 p-0">

        <div class="bg-danger text-center py-3">
            <h1 class="m-0">Find Your Dream Home With Us</h1>
        </div>

    </div>


    <!-- Contact Section -->
    <div class="container-fluid">

        <div class="row">

            <!-- Instagram -->
            <div class="col-md-4 bg-success text-center py-3">

                <i class="bi bi-instagram fs-1"></i>

                <h2>real@estate</h2>

            </div>


            <!-- Email -->
            <div class="col-md-4 bg-warning text-center py-3">

             <i class="bi bi-envelope-fill fs-1"></i>
              <a href="maito:bapushinde264@gmail.com">
                <h3>bapushinde264@gmail.com</h3> </a>

            </div>


            <!-- Phone -->
            <div class="col-md-4 bg-info text-center py-3">
              <a href="tel:+918767020988">
                <i class="bi bi-telephone-fill fs-1"></i>
                  <h3>8767020988</h3> 
             </a>

            </div>

        </div>

    </div>


    <!-- Registration Form -->
    <div class="container my-5 bg-light mt-2">

        <div class="register-form p-0">

            <h2 class="text-center mb-4">
                Register
            </h2>


            <form id="registerForm" novalidate>

                <!-- ROW 1 -->
                <div class="row">

                    <!-- Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               placeholder="Enter your name"
                               required>

                        <div class="invalid-feedback">
                            Please enter your name.
                        </div>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>

                        <div class="invalid-feedback">
                            Please enter a valid email.
                        </div>

                    </div>

                </div>


                <!-- ROW 2 -->
                <div class="row">

                    <!-- Contact Number -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Contact Number
                        </label>

                        <input type="tel"
                               id="contact"
                               class="form-control"
                               placeholder="Enter contact number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>

                        <div class="invalid-feedback">
                            Enter a valid 10-digit number.
                        </div>

                    </div>


                    <!-- Requirement -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Requirement
                        </label>

                        <select class="form-select"
                                id="requirement"
                                required>

                            <option value="">
                                Select Requirement
                            </option>

                            <option value="buy">
                                Buy
                            </option>

                            <option value="rent">
                                Rent
                            </option>

                        </select>

                        <div class="invalid-feedback">
                            Please select requirement.
                        </div>

                    </div>

                </div>


                <!-- ROW 3 -->
                <div class="row">

                    <!-- Location -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <select class="form-select"
                                id="location"
                                required>

                            <option value="">
                                Select Location
                            </option>

                        </select>

                        <div class="invalid-feedback">
                            Please select location.
                        </div>

                    </div>


                    <!-- Submit -->
                    <div class="col-md-6 mb-3 d-flex align-items-end">

                        <button type="submit"
                                class="btn btn-primary px-5">

                            Submit

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        // Requirement -> Location
        document.getElementById("requirement")
            .addEventListener("change", function () {

                let location =
                    document.getElementById("location");

                location.innerHTML =
                    '<option value="">Select Location</option>';


                // Buy locations
                if (this.value === "buy") {

                    location.innerHTML += `
                        <option value="Moshi">Moshi</option>
                        <option value="Chikhali">Chikhali</option>
                    `;

                }


                // Rent locations
                if (this.value === "rent") {

                    location.innerHTML += `
                        <option value="Akurdi">Akurdi</option>
                        <option value="Ravet">Ravet</option>
                    `;

                }

            });


        // Form Validation
        document.getElementById("registerForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                let name =
                    document.getElementById("name");

                let email =
                    document.getElementById("email");

                let contact =
                    document.getElementById("contact");

                let requirement =
                    document.getElementById("requirement");

                let location =
                    document.getElementById("location");


                let valid = true;


                // Name
                if (name.value.trim() === "") {

                    name.classList.add("is-invalid");
                    valid = false;

                } else {

                    name.classList.remove("is-invalid");
                    name.classList.add("is-valid");

                }


                // Email
                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email.value.trim())) {

                    email.classList.add("is-invalid");
                    valid = false;

                } else {

                    email.classList.remove("is-invalid");
                    email.classList.add("is-valid");

                }


                // Contact
                let contactPattern =
                    /^[0-9]{10}$/;

                if (!contactPattern.test(contact.value.trim())) {

                    contact.classList.add("is-invalid");
                    valid = false;

                } else {

                    contact.classList.remove("is-invalid");
                    contact.classList.add("is-valid");

                }


                // Requirement
                if (requirement.value === "") {

                    requirement.classList.add("is-invalid");
                    valid = false;

                } else {

                    requirement.classList.remove("is-invalid");
                    requirement.classList.add("is-valid");

                }


                // Location
                if (location.value === "") {

                    location.classList.add("is-invalid");
                    valid = false;

                } else {

                    location.classList.remove("is-invalid");
                    location.classList.add("is-valid");

                }


                // Success
                if (valid) {

                    alert("Registration submitted successfully!");

                    this.reset();

                    document
                        .querySelectorAll(".is-valid")
                        .forEach(function (element) {

                            element.classList.remove("is-valid");

                        });

                }

            });

    </script>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
