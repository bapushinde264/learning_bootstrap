
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Estate Registration</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <style>

        /* ================= BODY ================= */

        body {
            margin: 0;
            padding: 0;
            background-color: #a69f9f;
            font-family: Arial, sans-serif;
        }


        /* ================= HEADER ================= */

        .main-header {
            background-color: #dc3545;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 32px;
        }


        /* ================= CONTACT SECTION ================= */

        .contact-box {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .contact-box i {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .contact-box h3,
        .contact-box h2 {
            margin: 5px 0;
            word-break: break-word;
        }

        .contact-box a {
            color: inherit;
            text-decoration: none;
        }


        /* ================= FORM CONTAINER ================= */

        .form-container {
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);
        }


        /* ================= FORM ================= */

        .register-form .form-control,
        .register-form .form-select {
            min-height: 45px;
        }

        .form-label {
            font-weight: bold;
        }


        /* ================= BUTTON ================= */

        .submit-btn {
            min-height: 45px;
            min-width: 120px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 767px) {

            .main-header {
                padding: 15px 10px;
            }

            .main-header h1 {
                font-size: 24px;
                line-height: 1.3;
            }


            /* Contact boxes */

            .contact-box {
                min-height: 130px;
                padding: 15px 10px;
            }

            .contact-box i {
                font-size: 32px;
            }

            .contact-box h2,
            .contact-box h3 {
                font-size: 18px;
            }


            /* Form */

            .form-container {
                margin: 20px 10px;
                padding: 20px 15px;
                border-radius: 10px;
            }

            .form-title {
                font-size: 26px;
                margin-bottom: 25px;
            }


            /* Submit button */

            .submit-wrapper {
                display: block !important;
            }

            .submit-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="main-header">

        <h1>
            Find Your Dream Home With Us
        </h1>

    </header>


    <!-- ================= CONTACT SECTION ================= -->

    <section class="container-fluid">

        <div class="row g-0">


            <!-- Instagram -->

            <div class="col-12 col-md-4 bg-success text-white">

                <div class="contact-box">

                    <i class="bi bi-instagram"></i>

                    <h2>
                        real_estate
                    </h2>

                </div>

            </div>


            <!-- Email -->

            <div class="col-12 col-md-4 bg-warning">

                <div class="contact-box">

                    <i class="bi bi-envelope-fill"></i>

                    <a href="mailto:bapushinde264@gmail.com">

                        <h3>
                            bapushinde264@gmail.com
                        </h3>

                    </a>

                </div>

            </div>


            <!-- Phone -->

            <div class="col-12 col-md-4 bg-info">

                <div class="contact-box">

                    <a href="tel:+918767020988">

                        <i class="bi bi-telephone-fill"></i>

                        <h3>
                            8767010988
                        </h3>

                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= REGISTRATION FORM ================= -->

    <div class="form-container">

        <h2 class="text-center form-title mb-4">
            Register
        </h2>


        <form id="registerForm" novalidate>


            <!-- ROW 1 -->

            <div class="row">


                <!-- Name -->

                <div class="col-12 col-md-6 mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                        required
                    >

                    <div class="invalid-feedback">
                        Please enter your name.
                    </div>

                </div>


                <!-- Email -->

                <div class="col-12 col-md-6 mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                    <div class="invalid-feedback">
                        Please enter a valid email.
                    </div>

                </div>

            </div>


            <!-- ROW 2 -->

            <div class="row">


                <!-- Contact -->

                <div class="col-12 col-md-6 mb-3">

                    <label
                        for="contact"
                        class="form-label"
                    >
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        class="form-control"
                        placeholder="Enter 10-digit number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                    <div class="invalid-feedback">
                        Enter a valid 10-digit number.
                    </div>

                </div>


                <!-- Requirement -->

                <div class="col-12 col-md-6 mb-3">

                    <label
                        for="requirement"
                        class="form-label"
                    >
                        Requirement
                    </label>

                    <select
                        class="form-select"
                        id="requirement"
                        required
                    >

                        <option value="">
                            Select Requirement
                        </option>

                        <option value="buy">
                            Buy
                        </option>

                        <option value="rent">
                            Rent
                        </option>

                    </select>

                    <div class="invalid-feedback">
                        Please select requirement.
                    </div>

                </div>

            </div>


            <!-- ROW 3 -->

            <div class="row">


                <!-- Location -->

                <div class="col-12 col-md-6 mb-3">

                    <label
                        for="location"
                        class="form-label"
                    >
                        Location
                    </label>

                    <select
                        class="form-select"
                        id="location"
                        required
                    >

                        <option value="">
                            Select Location
                        </option>

                    </select>

                    <div class="invalid-feedback">
                        Please select location.
                    </div>

                </div>


                <!-- Submit -->

                <div class="col-12 col-md-6 mb-3 d-flex align-items-end submit-wrapper">

                    <button
                        type="submit"
                        class="btn btn-primary submit-btn"
                    >
                        Submit
                    </button>

                </div>

            </div>


        </form>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ==========================================
           REQUIREMENT -> LOCATION
        ========================================== */

        document
            .getElementById("requirement")
            .addEventListener("change", function () {

                const location =
                    document.getElementById("location");

                location.innerHTML =
                    '<option value="">Select Location</option>';


                /* Buy */

                if (this.value === "buy") {

                    location.innerHTML += `
                        <option value="Moshi">
                            Moshi
                        </option>

                        <option value="Chikhali">
                            Chikhali
                        </option>
                    `;

                }


                /* Rent */

                if (this.value === "rent") {

                    location.innerHTML += `
                        <option value="Akurdi">
                            Akurdi
                        </option>

                        <option value="Ravet">
                            Ravet
                        </option>
                    `;

                }

            });


        /* ==========================================
           FORM VALIDATION
        ========================================== */

        document
            .getElementById("registerForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name");

                const email =
                    document.getElementById("email");

                const contact =
                    document.getElementById("contact");

                const requirement =
                    document.getElementById("requirement");

                const location =
                    document.getElementById("location");


                let valid = true;


                /* Remove old validation */

                document
                    .querySelectorAll(".is-valid, .is-invalid")
                    .forEach(function (element) {

                        element.classList.remove(
                            "is-valid",
                            "is-invalid"
                        );

                    });


                /* ==================================
                   NAME
                ================================== */

                if (name.value.trim() === "") {

                    name.classList.add("is-invalid");

                    valid = false;

                } else {

                    name.classList.add("is-valid");

                }


                /* ==================================
                   EMAIL
                ================================== */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(
                        email.value.trim()
                    )
                ) {

                    email.classList.add("is-invalid");

                    valid = false;

                } else {

                    email.classList.add("is-valid");

                }


                /* ==================================
                   CONTACT
                ================================== */

                const contactPattern =
                    /^[0-9]{10}$/;


                if (
                    !contactPattern.test(
                        contact.value.trim()
                    )
                ) {

                    contact.classList.add("is-invalid");

                    valid = false;

                } else {

                    contact.classList.add("is-valid");

                }


                /* ==================================
                   REQUIREMENT
                ================================== */

                if (requirement.value === "") {

                    requirement.classList.add("is-invalid");

                    valid = false;

                } else {

                    requirement.classList.add("is-valid");

                }


                /* ==================================
                   LOCATION
                ================================== */

                if (location.value === "") {

                    location.classList.add("is-invalid");

                    valid = false;

                } else {

                    location.classList.add("is-valid");

                }


                /* ==================================
                   SUCCESS
                ================================== */

                if (valid) {

                    alert(
                        "Registration submitted successfully!"
                    );

                    this.reset();

                    location.innerHTML =
                        '<option value="">Select Location</option>';

                    document
                        .querySelectorAll(".is-valid")
                        .forEach(function (element) {

                            element.classList.remove(
                                "is-valid"
                            );

                        });

                }

            });


    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
